    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {

      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);

        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hayCarga }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" aria-live=\"polite\" style=\"position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(250,250,251,.7); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); animation: aparecerCarga 220ms ease-out 180ms both;\">\n      <div style=\"display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E4E1E8; border-radius: 14px; padding: 16px 20px; font-size: 14px; font-weight: 500; color: #1D1B22; box-shadow: 0 10px 15px -3px rgba(29,27,34,.1), 0 4px 6px -4px rgba(29,27,34,.1);\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7C07A6\" sc-camel-stroke-width=\"2\" sc-camel-stroke-linecap=\"round\" style=\"flex-shrink: 0; animation: girar 1s linear infinite;\"><path d=\"M21 12a9 9 0 1 1-6.219-8.56\"><\u002Fpath><\u002Fsvg>\n        <span>{{ cargaMensaje }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hayToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: absolute; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; background: #2D2A33; color: #F3F1F5; border-radius: 10px; padding: 14px 16px; font-size: 14px; font-weight: 500; z-index: 50; box-shadow: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:900}}\">\nconst COLORES = [\"#A53692\", \"#5CC6D0\", \"#FFFFFF\", \"#101013\"];\nconst PDF_MAX = 4 * 1024 * 1024;\n// Asistente de uso: cada paso señala el elemento con data-guide=\"t\". Sin \"t\" (o si el elemento no\n// está en pantalla) la tarjeta sale centrada. \"m\": el paso está en el menú lateral (en celular se abre).\n// \"si\": el paso solo aplica cuando se cumple (angosto, ancho, admin, instalable).\nconst GUIAS = {\n  proyectos: [\n    { titulo: \"¡Bienvenido a Levantamientos!\", texto: \"Esta es la libreta digital de campo de Diseñarte: aquí capturas fotos, medidas y notas de cada sitio. Todo se guarda en el teléfono y se sube solo cuando hay internet. Este asistente te explica cada pantalla y para qué sirve cada botón.\", nota: \"Avanza con \\\"Siguiente\\\" o con las flechas del teclado. \\\"Saltar\\\" cierra la guía de esta pantalla.\" },\n    { t: \"menu-boton\", si: \"angosto\", titulo: \"Botón de menú\", texto: \"Abre el menú lateral. Desde ahí cambias de sección, sincronizas, cambias tu contraseña y sales. Se cierra al elegir una opción, tocando fuera o con la ×.\" },\n    { t: \"menu-nav\", m: true, titulo: \"Secciones\", texto: \"Estas opciones te llevan a cada parte de la app:\", lista: [[\"Proyectos\", \"la lista de tus levantamientos y las copias que te compartieron.\"], [\"Nuevo levantamiento\", \"el formulario para empezar uno.\"]] },\n    { t: \"menu-nav\", m: true, si: \"admin\", titulo: \"Administración\", texto: \"Como admin también ves \\\"Administración\\\": ahí das de alta cuentas, cambias roles y abres los proyectos de todo el equipo.\" },\n    { t: \"menu-cuenta\", m: true, titulo: \"Tu cuenta\", texto: \"Opciones de tu sesión:\", lista: [[\"Sincronizar ahora\", \"sube tus cambios y baja lo nuevo en ese momento. La app también lo hace sola cada minuto.\"], [\"Cambiar contraseña\", \"pide la actual y una nueva de al menos 10 caracteres.\"], [\"Asistente de uso\", \"enciende o apaga estas guías.\"], [\"Ver guía de esta pantalla\", \"vuelve a mostrar la guía aunque el asistente esté apagado.\"], [\"Instalar como app\", \"aparece si abriste la app desde el navegador.\"]] },\n    { t: \"menu-usuario\", m: true, titulo: \"Estado y salida\", texto: \"Abajo ves tu nombre, tu rol y el estado de sincronización: verde es todo subido, amarillo hay pendientes y rojo no hay conexión. \\\"Salir\\\" cierra tu sesión; si hay proyectos sin subir, la app te avisa antes.\" },\n    { t: \"ayuda\", si: \"angosto\", titulo: \"Ayuda en cualquier momento\", texto: \"El botón ? vuelve a mostrar la guía de la pantalla en la que estés.\" },\n    { t: \"proy-estado\", titulo: \"Resumen\", texto: \"Cuántos proyectos tienes y si ya están sincronizados con el servidor.\" },\n    { t: \"proy-buscar\", titulo: \"Buscar\", texto: \"Escribe parte del nombre del cliente o del sitio para filtrar la lista.\" },\n    { t: \"proy-tarjeta\", si: \"hayProyectos\", titulo: \"Un proyecto\", texto: \"Cada tarjeta muestra:\", lista: [[\"Foto\", \"la primera foto del levantamiento.\"], [\"Cliente y sitio\", \"a quién y dónde.\"], [\"Resumen\", \"hojas, fotos y fecha; si es una copia o de otra persona, también lo indica.\"], [\"Por subir\", \"aparece mientras tiene cambios sin sincronizar.\"]], nota: \"Tócala para abrir sus hojas.\" },\n    { t: \"proy-borrar\", si: \"hayProyectos\", titulo: \"Borrar proyecto\", texto: \"La × elimina el levantamiento también del servidor. La app te pide confirmar antes y no se puede deshacer.\" },\n    { t: \"proy-nuevo\", titulo: \"Nuevo levantamiento\", texto: \"Abre el formulario para capturar el cliente y el sitio y empezar un proyecto nuevo.\" }\n  ],\n  nuevo: [\n    { t: \"nuevo-form\", titulo: \"Datos del levantamiento\", texto: \"Solo el cliente es obligatorio. Los demás los puedes llenar ahora o después:\", lista: [[\"Sitio o planta\", \"el lugar exacto.\"], [\"Contacto, teléfono y correo\", \"a quién llamar en el cliente; desde el proyecto podrás marcarle o escribirle con un toque.\"], [\"Responsable Diseñarte\", \"quién hace el levantamiento; se recuerda para el siguiente.\"], [\"Fecha\", \"se pone sola con el día de hoy.\"]] },\n    { t: \"nuevo-crear\", titulo: \"Comenzar levantamiento\", texto: \"Crea el proyecto y te lleva a sus hojas. La flecha ← regresa sin crear nada.\" }\n  ],\n  hojas: [\n    { titulo: \"Hojas del proyecto\", texto: \"Un proyecto se divide en hojas: cada hoja es un área del sitio (recepción, fachada, comedor) con sus propias fotos y notas.\" },\n    { t: \"hojas-editar\", titulo: \"Datos del proyecto\", texto: \"El lápiz abre los datos del cliente para corregirlos: sitio, contacto, teléfono, correo y responsable.\" },\n    { t: \"hojas-contacto\", si: \"hayContacto\", titulo: \"Contacto\", texto: \"Si capturaste teléfono o correo, aquí los tienes a un toque: el botón morado llama y el otro abre tu correo.\" },\n    { t: \"hojas-propuesta\", titulo: \"Propuesta final\", texto: \"Guarda el PDF de la propuesta final de este proyecto (máximo 4 MB). \\\"Abrir\\\" lo muestra, \\\"Reemplazar\\\" sube una versión nueva y × lo quita. Se sincroniza y viaja en las copias que compartes.\" },\n    { t: \"hoja-tarjeta\", si: \"hayHojas\", titulo: \"Una hoja\", texto: \"Muestra la foto de portada, el nombre del área y cuántas fotos y notas tiene. Tócala para abrirla.\" },\n    { t: \"hoja-duplicar\", si: \"hayHojas\", titulo: \"Duplicar hoja\", texto: \"Hace una copia de la hoja con todo su contenido; útil para áreas que se repiten.\" },\n    { t: \"hoja-eliminar\", si: \"hayHojas\", titulo: \"Eliminar hoja\", texto: \"Borra la hoja con sus fotos y notas después de confirmar.\" },\n    { t: \"hojas-nueva\", titulo: \"Nueva hoja\", texto: \"Agrega un área nueva. Puedes escribir el nombre o elegir una sugerencia.\" },\n    { t: \"hojas-compartir\", titulo: \"Compartir proyecto\", texto: \"Envía una copia independiente a otra persona del equipo; lo que ella cambie no afecta tu original.\", nota: \"\\\"Se guarda solo\\\" indica que no hace falta guardar a mano.\" }\n  ],\n  editar: [\n    { t: \"editar-form\", titulo: \"Datos del proyecto\", texto: \"Corrige lo que necesites: cliente, sitio, contacto, teléfono, correo y responsable.\" },\n    { t: \"editar-guardar\", titulo: \"Guardar cambios\", texto: \"Aplica los cambios y regresa a las hojas. \\\"Cancelar\\\" o ← regresan sin modificar nada.\" }\n  ],\n  nuevaHoja: [\n    { t: \"nh-nombre\", titulo: \"Nombre de la hoja\", texto: \"Escribe el área del sitio que vas a documentar.\" },\n    { t: \"nh-sugerencias\", titulo: \"Sugerencias\", texto: \"Toca una para llenar el nombre al instante.\" },\n    { t: \"nh-crear\", titulo: \"Crear hoja\", texto: \"Crea la hoja y la abre para que empieces a tomar fotos.\" }\n  ],\n  hoja: [\n    { t: \"hoja-elemento\", si: \"hayElementos\", titulo: \"Fotos y notas\", texto: \"Todo lo que capturas en esta hoja aparece aquí, del más reciente al más antiguo:\", lista: [[\"Foto\", \"tócala para abrir el editor y marcarla; abajo se listan sus pines con su medida.\"], [\"Pin con audio\", \"el botón ▶ reproduce la explicación grabada.\"], [\"Nota de voz o escrita\", \"puedes corregir el texto directamente.\"], [\"×\", \"elimina la foto o la nota.\"]] },\n    { t: \"hoja-voz\", titulo: \"Voz\", texto: \"Graba una nota hablada. Toca \\\"Detener\\\" para terminar; queda en la lista y puedes escribir debajo lo que dijiste.\" },\n    { t: \"hoja-nota\", titulo: \"Nota\", texto: \"Agrega una nota escrita. Se guarda mientras escribes.\" },\n    { t: \"hoja-rafaga\", si: \"nativo\", titulo: \"Modo ráfaga\", texto: \"Aparece si usas la cámara del teléfono. Te regresa a la cámara de la app para disparar varias fotos sin salir.\" },\n    { t: \"hoja-foto\", titulo: \"Foto\", texto: \"Abre la cámara para tomar fotos de esta hoja. Puedes tomar varias seguidas.\" }\n  ],\n  camara: [\n    { t: \"cam-disparador\", titulo: \"Disparador\", texto: \"El círculo blanco toma la foto. Dispara las veces que necesites; cada foto se agrega a la hoja y se comprime sola.\" },\n    { t: \"cam-galeria\", titulo: \"Galería\", texto: \"Elige fotos que ya tienes en el teléfono. Puedes seleccionar varias a la vez.\" },\n    { t: \"cam-nativa\", titulo: \"Cámara del teléfono\", texto: \"Usa la cámara nativa en lugar de la de la app. Sirve si la de la app no enfoca bien o no abre.\" },\n    { t: \"cam-listo\", titulo: \"Listo\", texto: \"Cierra la cámara y regresa a la hoja con las fotos que tomaste.\" }\n  ],\n  editor: [\n    { t: \"ed-modo\", titulo: \"Ver y Editar\", texto: \"En Editar, al tocar la foto pones marcas. En Ver te mueves y haces zoom sin marcar por accidente; el botón de % regresa el zoom a 1:1.\" },\n    { t: \"ed-herramientas\", titulo: \"Herramientas\", texto: \"Elige qué vas a poner sobre la foto:\", lista: [[\"Pin\", \"un punto numerado con su medida o descripción y, si quieres, un audio.\"], [\"Rayar\", \"dibujo a mano libre.\"], [\"Sombra\", \"marca un área rectangular.\"], [\"Flecha\", \"señala una dirección.\"], [\"Texto\", \"escribe directamente sobre la foto.\"], [\"Marcas\", \"la lista de todo lo que pusiste.\"]] },\n    { t: \"ed-colores\", titulo: \"Color\", texto: \"El color con el que se dibuja la siguiente marca.\" },\n    { t: \"ed-copiar\", titulo: \"Copiar\", texto: \"Copia la foto al portapapeles para pegarla en diseño: \\\"Copiar editada\\\" lleva las marcas y \\\"Copiar original\\\" va limpia.\" },\n    { t: \"ed-girar\", titulo: \"Girar\", texto: \"Gira la foto 90° y reacomoda las marcas para que sigan en su lugar.\" },\n    { t: \"ed-deshacer\", titulo: \"Deshacer y rehacer\", texto: \"↩ quita el último cambio y ↪ lo regresa.\" },\n    { t: \"ed-guardar\", titulo: \"Guardar\", texto: \"Guarda las marcas. Si sales con ← sin guardar, la app te pregunta si guardas o descartas.\" }\n  ],\n  pin: [\n    { t: \"pin-medida\", titulo: \"Medida o descripción\", texto: \"Escribe la medida o lo que señala el pin, por ejemplo \\\"4.20 m de ancho\\\". Aparece como etiqueta junto al pin.\" },\n    { t: \"pin-audio\", titulo: \"Grabar audio\", texto: \"Graba una explicación hablada para este pin. Toca \\\"Detener grabación\\\" al terminar.\" },\n    { t: \"pin-listo\", titulo: \"Listo\", texto: \"Cierra el panel. El pin se queda en la foto; tócalo otra vez para editarlo.\" }\n  ],\n  marcas: [\n    { t: \"ed-marcas\", titulo: \"Marcas de la foto\", texto: \"Toca una marca para editarla, ✕ para borrarla o \\\"Borrar todas las marcas\\\" para limpiar la foto. La × cierra la lista.\" }\n  ],\n  compartir: [\n    { t: \"comp-lista\", titulo: \"Elegir personas\", texto: \"Toca a una o varias personas del equipo. Cada una recibe su propia copia con las fotos y tú conservas el original.\" },\n    { t: \"comp-enviar\", titulo: \"Enviar\", texto: \"Envía las copias. Necesitas internet. La × cierra sin enviar.\" }\n  ],\n  admin: [\n    { titulo: \"Administración\", texto: \"Aquí se administra quién entra a la app y se consultan los proyectos de todo el equipo. Solo los admin la ven.\" },\n    { t: \"admin-tabs\", titulo: \"Usuarios y Proyectos de todos\", texto: \"Cambia entre las cuentas del equipo y los proyectos de todos. \\\"Actualizar\\\" recarga la información.\" },\n    { t: \"admin-usuario\", si: \"hayUsuarios\", titulo: \"Una cuenta\", texto: \"Nombre, correo, rol, cuántos proyectos tiene y su último acceso.\" },\n    { t: \"admin-editar\", si: \"hayUsuarios\", titulo: \"Editar\", texto: \"Cambia el nombre, el correo o el rol.\", lista: [[\"Usuario\", \"ve solo sus proyectos y las copias que le comparten.\"], [\"Admin\", \"ve y administra todo.\"]] },\n    { t: \"admin-reset\", si: \"hayUsuarios\", titulo: \"Nueva contraseña\", texto: \"Genera otra contraseña temporal y cierra las sesiones abiertas de esa persona.\" },\n    { t: \"admin-alternar\", si: \"hayOtros\", titulo: \"Desactivar y reactivar\", texto: \"Desactivar bloquea el acceso sin borrar sus proyectos; Reactivar se lo devuelve.\" },\n    { t: \"admin-nuevo\", titulo: \"Nuevo usuario\", texto: \"Crea una cuenta con nombre y correo. La app genera una contraseña temporal que puedes copiar y enviar; la persona la cambia al entrar.\" }\n  ]\n};\nconst HERRAMIENTAS = [\n  { id: \"pin\", icono: \"◉\", nombre: \"Pin\" },\n  { id: \"trazo\", icono: \"✏\", nombre: \"Rayar\" },
